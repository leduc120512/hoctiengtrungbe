# =====================================================================
# Cau hinh ung dung "Web hoc tieng Trung"
# Khong hard-code bi mat: moi gia tri nhay cam deu doc tu bien moi truong.
#   DB_USERNAME / DB_PASSWORD : tai khoan MySQL
#   JWT_SECRET                : khoa ky JWT (bat buoc >= 32 byte o moi truong that)
# =====================================================================
spring:
  application.name: bewebtiengtrung

  datasource:
    url: jdbc:mysql://localhost:3306/hoctiengtrung?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

# Cau hinh rieng cua ung dung (anh xa vao lop config/AppProperties)
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-min-32-bytes-long-secret-key}
    access-token-ttl: 3600          # giay (1 gio)
    refresh-token-ttl: 2592000      # giay (30 ngay)
    issuer: bewebtiengtrung
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:4200

server.port: 8080

springdoc.swagger-ui.path: /swagger-ui.html
